####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################

version: "1.0"
linter: qodana-rust
profile:
  name: qodana.recommended
include:
  - name: CheckDependencyLicenses
# Qodana's TOML resolver does not understand Cargo weak-dep feature syntax
# `indexmap/serde` in `[features]` (valid cargo; enables indexmap's serde feature
# only when our `serde` feature is on). Suppress the false-positive High finding.
#
# Sanity "Cargo project loading" also flakes when optional native deps (hdf5)
# are not present in the analysis environment — not an actionable product bug.
exclude:
  - name: TomlUnresolvedReference
    paths:
      - Cargo.toml
  - name: QodanaRustSanity
    paths:
      - Cargo.toml
