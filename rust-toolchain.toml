# Pinned toolchain for local dev, CI, Cursor cloud agents, and PR bots.
# Keep in sync with .github/workflows/ci.yml (`toolchain: 1.99.0`) and
# .cursor/Dockerfile (rust:1.99.0-bookworm matches this pin).
# Components ensure fmt/clippy exist for the quality bar.
[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
