# Machine-readable catalog of vendored Synfire registry fixtures.
# Source of truth for provenance; keep in sync with README.md tables.
#
# These files were acquired from the Synfire model registry (see GitHub #43 /
# LIM-1085). Acquisition is maintainer-only; committed bytes make CI fully
# offline. Every value here was observed by loading the committed .nir files
# through nir_rs::io::read + validate_structure(). Keep each key and each list
# on ONE line: a hand-written single-line `key = value` parser reads this file
# (no TOML dependency is added, per AGENTS.md).

source = "synfire registry"
registry_url = "https://synfire.rpd-34.dev"
# synfire_cli_version is the observed `synfire --version` string (0.0.1). The
# published PyPI package is 0.0.2; the CLI's internal _version.py lags it.
synfire_cli_version = "0.0.1"
synfire_pypi_version = "0.0.2"
corpus_as_of = "2026-09-29"
milestone = "v0.4.5"
modified = false
notes = """
First pinned Synfire compatibility baseline for milestone v0.4.5 (GitHub #43 /
LIM-1085). The baseline is the FIVE-model pinned corpus below; do not substitute
versions or add models. All five load and validate under nir-rs, so all are
`supported`. CI and default tests never contact the registry or authenticate;
the committed bytes plus these SHA-256 values are authoritative.
"""

