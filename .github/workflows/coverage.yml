# Coverage reporting is observational until a reviewed baseline is available.
# It must never replace the required CI, package, or semver gates.
name: Coverage

on:
  push:
    branches: [Main, main]
  pull_request:
    branches: [Main, main]

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Rust coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          # Keep in sync with rust-toolchain.toml and the required CI jobs.
          toolchain: "1.98.1"
          components: llvm-tools-preview

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: coverage-1.98.1

      # Required by optional `hdf5` so coverage includes all feature-gated code.
      - name: Install libhdf5
        run: |
          set -euo pipefail
          for f in /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*; do
            [ -e "$f" ] && sudo mv "$f" "${f}.disabled" || true
          done
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev pkg-config

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@868747438ea8f2c3701d0cf6fe59dcfebbdb06a2 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov

      - name: Generate LCOV report
        run: cargo llvm-cov --locked --all-features --workspace --lcov --output-path lcov.info

      # The organization-managed token is supplied only at runtime. The explicit
      # slug is required when Codecov receives an organization upload token.
      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Limen-Neural/nir-rs
          files: lcov.info
          disable_search: true
          flags: rust
          fail_ci_if_error: false
          verbose: true

      # Inspect the secret only in this shell step. The output is non-secret and
      # lets later conditions avoid exposing the token to the test/build steps.
      - name: Check Codacy configuration
        id: codacy
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          if [ -n "$CODACY_PROJECT_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain skipped Codacy upload
        if: steps.codacy.outputs.configured != 'true'
        run: |
          echo "::notice::Codacy coverage upload skipped: add CODACY_PROJECT_TOKEN after connecting the repository in Codacy."

      - name: Upload coverage to Codacy
        if: steps.codacy.outputs.configured == 'true'
        continue-on-error: true
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: lcov.info
          language: Rust
