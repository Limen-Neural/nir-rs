# Docker build + dual push (Docker Hub + GitHub Container Registry).
# Third-party Actions pinned to immutable commit SHAs.
# Local Buildx only (no Docker Build Cloud).
#
# PR: verify build + run tests in builder stage (contents: read only).
# main / tag: publish to Hub + GHCR (packages: write only on publish job).
name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  docker-verify:
    name: docker verify
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        # Same-repo human PRs may pull private base layers; Dependabot has no secrets.
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Set image tags
        id: image
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          echo "runtime_tag=nir-rs:pr-${SHA}" >> "$GITHUB_OUTPUT"
          echo "builder_tag=nir-rs:builder-pr-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build runtime image (load locally)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.image.outputs.runtime_tag }}

      - name: Smoke runtime image
        run: |
          set -euo pipefail
          docker run --rm "${{ steps.image.outputs.runtime_tag }}" rustc --version
          docker run --rm "${{ steps.image.outputs.runtime_tag }}" \
            sh -c 'test -x /usr/local/bin/load_inspect_lif'
          docker run --rm "${{ steps.image.outputs.runtime_tag }}" \
            sh -c 'pkg-config --exists hdf5'

      # Builder stage already runs `cargo test --all-features` during the image build.
      - name: Build builder stage (exercises tests inside Dockerfile)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          target: builder
          tags: ${{ steps.image.outputs.builder_tag }}

  docker-publish:
    name: docker publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Set image tags
        id: image
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          VER=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "${VER}" ] || ! printf '%s' "${VER}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Failed to extract semver X.Y.Z from Cargo.toml (got: ${VER:-empty})"
            exit 1
          fi
          HUB="${{ vars.DOCKER_USER }}/nir-rs"
          GHCR="ghcr.io/limen-neural/nir-rs"
          TAGS="${HUB}:${SHA},${HUB}:${VER},${HUB}:latest"
          TAGS="${TAGS},${GHCR}:${SHA},${GHCR}:${VER},${GHCR}:latest"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
