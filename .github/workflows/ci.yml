name: CI

on:
  push:
    branches: [Main, main]
  pull_request:
    branches: [Main, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          # Keep in sync with rust-toolchain.toml channel = "1.97.1".
          toolchain: "1.97.1"
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.97.1"
          components: clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # Required by optional `hdf5` so clippy sees all-features bodies.
      - name: Install libhdf5
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev pkg-config

      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.97.1"

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install libhdf5
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev pkg-config

      - name: Verify documentation
        run: cargo doc --no-deps --all-features

  # Pure graph model: no native deps. Linux / macOS / Windows on **Rust 1.97.1**.
  test-default:
    name: Test default (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.97.1"

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: default-${{ matrix.os }}-1.97.1

      # Proves the default graph-only build needs no libhdf5 (crates.io default).
      - name: Run tests (default features)
        run: cargo test

      - name: Run tests (serde feature)
        run: cargo test --features serde

  # HDF5 + serde: system libhdf5 on each OS. Same OS matrix, Rust 1.97.1.
  test-hdf5:
    name: Test hdf5 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.97.1"

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: hdf5-${{ matrix.os }}-1.97.1

      - name: Install libhdf5 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev pkg-config

      - name: Install libhdf5 (macOS)
        if: runner.os == 'macOS'
        run: brew install hdf5 pkg-config

      # Windows: conda-forge provides a consistent HDF5 + pkg-config story
      # (matches how hdf5-metno CI exercises Windows). Login shell keeps conda active.
      - name: Install Miniconda (Windows)
        if: runner.os == 'Windows'
        uses: conda-incubator/setup-miniconda@a2223048f58c2a4c1d4cba4b68f21e5da66c1da5 # v3.2.0
        with:
          auto-update-conda: false
          activate-environment: nir-rs-hdf5
          python-version: "3.12"
          conda-remove-defaults: true

      - name: Install libhdf5 (Windows / conda-forge)
        if: runner.os == 'Windows'
        shell: bash -l {0}
        run: |
          conda install -y -c conda-forge hdf5 pkg-config
          echo "HDF5_DIR=$CONDA_PREFIX" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$CONDA_PREFIX/lib/pkgconfig:$CONDA_PREFIX/Library/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "$CONDA_PREFIX/Library/bin" >> "$GITHUB_PATH"
          echo "$CONDA_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Run tests (all features)
        if: runner.os != 'Windows'
        run: cargo test --all-features

      - name: Run tests (all features, Windows)
        if: runner.os == 'Windows'
        shell: bash -l {0}
        run: cargo test --all-features
