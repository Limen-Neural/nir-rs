name: CI

on:
  push:
    branches: [Main, main]
  pull_request:
    branches: [Main, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate, Test & Doc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          # Explicit channel required by this action pin; rust-toolchain.toml
          # still selects the same channel/components for local agents.
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Check formatting
        run: cargo fmt --check

      # Runs BEFORE libhdf5 is installed, so it genuinely proves the graph
      # model builds and tests without the native dependency — which is what
      # consumers get from a plain `cargo add nir-rs`. Moving this after the
      # install step would make it pass vacuously.
      - name: Run tests (default features, no libhdf5)
        run: cargo test

      # Required by the optional `hdf5` feature (hdf5-metno links libhdf5).
      # Ubuntu's package registers hdf5.pc, so pkg-config finds it unaided.
      - name: Install libhdf5
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev

      - name: Clippy (lint)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests (all features)
        run: cargo test --all-features

      - name: Verify documentation
        run: cargo doc --no-deps --all-features
