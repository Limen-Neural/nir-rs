name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  gate:
    # Cheap superset filter so an ordinary comment does not allocate a runner.
    # The script below is the authoritative check; this only has to avoid
    # false negatives, so it matches the command substring without boundaries.
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    # Only needs to read the collaborator permission level; the privileged
    # scopes belong to the `opencode` job alone.
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Check permissions and command
        id: check
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const comment = context.payload.comment.body;
            const commandPattern = /(?:^|\s)\/(?:oc|opencode)(?:\s|$)/;

            if (!commandPattern.test(comment)) {
              core.setOutput('allowed', 'false');
              return;
            }

            let permission;
            try {
              ({ data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor
              }));
            } catch (error) {
              // A non-collaborator is a 404, not a failure: denying them is the
              // gate working. Letting it throw would fail the job on every
              // outsider comment, turning a routine denial into a red check.
              // Anything else is a real API problem and must not be swallowed
              // into a silent deny.
              if (error.status === 404) {
                core.setOutput('allowed', 'false');
                return;
              }
              throw error;
            }

            // `getCollaboratorPermissionLevel` returns only admin/write/read/none —
            // 'maintain' collapses to 'write' and is never emitted.
            const allowed = ['write', 'admin'].includes(permission.permission);
            core.setOutput('allowed', String(allowed));

  opencode:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    concurrency:
      group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # github-v1.2.19 (tag: latest)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/kimi-k3
          use_github_token: true