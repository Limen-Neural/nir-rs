# Release-oriented packaging / semver gate (issue #28).
# Separate from the main fmt/clippy/test/doc quality bar in ci.yml.
name: Package

on:
  push:
    branches: [Main, main]
  pull_request:
    branches: [Main, main]

concurrency:
  group: package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: cargo package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          # Keep in sync with rust-toolchain.toml / ci.yml.
          toolchain: "1.98.1"

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: package-1.98.1

      - name: cargo package --list
        run: cargo package --list --locked

      - name: cargo package
        run: cargo package --locked

      - name: Assert required files are in the package
        run: |
          set -euo pipefail
          list="$(cargo package --list --locked)"
          required=(
            LICENSE-MIT
            LICENSE-APACHE-2.0
            README.md
            Cargo.toml
            src/lib.rs
            examples/load_inspect_lif.rs
            tests/fixtures/MANIFEST.toml
            tests/fixtures/lif_norse.nir
            tests/fixtures/two_lif_neurons.nir
            tests/fixtures/huggingface/MANIFEST.toml
            tests/fixtures/huggingface/LICENSE-NeuroCUDA
            tests/fixtures/huggingface/neurocuda_mlp_mnist.nir
            tests/fixtures/overflowing_extents.nir.hex
            tests/fixtures/synfire/MANIFEST.toml
            tests/fixtures/synfire/LICENSE-Synfire
            tests/fixtures/synfire/lifneuron-1.0.0.nir
            tests/fixtures/synfire/ifsynfire-0.1.0.nir
            tests/fixtures/synfire/nmnistcnn-1.0.0.nir
            tests/fixtures/synfire/brailernn-1.0.1.nir
            tests/fixtures/synfire/swavelet-1.0.0.nir
          )
          missing=0
          for f in "${required[@]}"; do
            if ! printf '%s\n' "$list" | grep -Fxq "$f"; then
              echo "::error::package is missing required path: $f"
              missing=1
            fi
          done
          # At least one vendored .nir fixture must ship for packaged tests/docs.
          if ! printf '%s\n' "$list" | grep -E '^tests/fixtures/.*\.nir$' >/dev/null; then
            echo "::error::package has no tests/fixtures/*.nir fixtures"
            missing=1
          fi
          # Hidden git-tracked CI configs pack unless listed in package.exclude.
          forbidden=(
            .deepsource.toml
          )
          leaked=0
          for f in "${forbidden[@]}"; do
            if printf '%s\n' "$list" | grep -Fxq "$f"; then
              echo "::error::package includes excluded path: $f"
              leaked=1
            fi
          done
          if [ "$missing" -ne 0 ] || [ "$leaked" -ne 0 ]; then
            echo "---- package --list ----"
            printf '%s\n' "$list"
            exit 1
          fi
          echo "Required package paths present; excluded CI configs omitted."

      - name: Test packaged crate (default features)
        run: |
          set -euo pipefail
          # cargo package writes target/package/nir-rs-<version>.crate and unpacks
          # a matching directory when packing. Version from Cargo.toml only (no Python).
          ver="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          test -n "$ver"
          pkg_dir="target/package/nir-rs-${ver}"
          test -d "$pkg_dir"
          # Default feature set only (no system libhdf5 required).
          (cd "$pkg_dir" && cargo test --locked)

      - name: Test packaged crate (serde and static HDF5)
        run: |
          set -euo pipefail
          ver="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          pkg_dir="target/package/nir-rs-${ver}"
          (
            cd "$pkg_dir"
            cargo test --locked --features serde
            cargo test --locked --features serde,hdf5,hdf5/static,hdf5/zlib
          )

  semver:
    name: cargo-semver-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Need full history so baseline-rev tags resolve.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.98.1"

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: semver-1.98.1

      - name: Install libhdf5 for API comparison
        run: |
          # GH Ubuntu images sometimes ship Microsoft/Azure apt sources that 403
          # and fail `apt-get update` before we can install libhdf5-dev.
          for f in /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*; do
            [ -e "$f" ] && sudo mv "$f" "${f}.disabled" || true
          done
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev pkg-config

      # Pin cargo-semver-checks so rustdoc JSON format stays compatible with 1.98.1
      # (older 0.40.x fails on rustdoc v57). Bump with the CI toolchain when needed.
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked --version 0.50.0

      - name: Check public API vs crates.io 0.4.4 (default)
        run: |
          cargo semver-checks check-release \
            --package nir-rs \
            --baseline-version 0.4.4 \
            --release-type patch \
            --default-features

      - name: Check public API vs crates.io 0.4.4 (serde)
        run: |
          cargo semver-checks check-release \
            --package nir-rs \
            --baseline-version 0.4.4 \
            --release-type patch \
            --only-explicit-features \
            --features serde

      - name: Check public API vs crates.io 0.4.4 (serde and hdf5)
        run: |
          cargo semver-checks check-release \
            --package nir-rs \
            --baseline-version 0.4.4 \
            --release-type patch \
            --only-explicit-features \
            --features serde,hdf5
